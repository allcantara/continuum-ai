name: Publish to npm

on:
  push:
    branches:
      - master
    paths:
      - package.json
      - package-lock.json
    tags:
      - v*
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish continuum-ai
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Verify OIDC publish prerequisites
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN is set — unset it for trusted publishing."
            exit 1
          fi
          if [ -f .npmrc ] && grep -q '_authToken' .npmrc; then
            echo ".npmrc contains _authToken — this blocks OIDC trusted publishing."
            cat .npmrc
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi

      - name: Typecheck, lint, test and build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Skip if version already published
        id: npm-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "continuum-ai@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} is already on npm — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing version ${VERSION}."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm via trusted publishing (OIDC)
        if: steps.npm-version.outputs.publish == 'true'
        run: npm publish --access public --ignore-scripts
